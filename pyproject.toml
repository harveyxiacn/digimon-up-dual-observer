[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "digimon-up-monitor"
version = "0.2.0"
description = "Digimon UP emulator screen monitor and safe automation helper"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "opencv-python>=4.10,<5",
  "Pillow>=10,<12",
  "PySide6>=6.8,<7",
  "PyYAML>=6,<7",
  "pytesseract>=0.3.13,<0.4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["digimon_monitor*"]
